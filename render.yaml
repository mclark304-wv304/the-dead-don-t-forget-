services:
  - type: web
    name: dead-dont-forget
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # "sandbox" while testing, "live" when taking real payments
      - key: PAYPAL_MODE
        value: live
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
